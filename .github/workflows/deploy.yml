name: Deploy Release to GitHub Pages

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag'
    
    permissions:
      contents: read
      pages: write
      id-token: write
    
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Build site
      run: npm run build

    - name: Check out Ink Signal
      uses: actions/checkout@v4
      with:
        repository: gv-sh/ink-signal
        ref: main
        path: .build/ink-signal

    - name: Install Ink Signal dependencies
      run: npm ci
      working-directory: .build/ink-signal

    - name: Build Ink Signal for /ink-signal/
      run: npm run build:website
      working-directory: .build/ink-signal
      env:
        VITE_BASE_PATH: /ink-signal/

    - name: Add Ink Signal to the Pages artifact
      run: mkdir -p _site/ink-signal && cp -R .build/ink-signal/apps/website/dist/. _site/ink-signal/

    - name: Setup Pages
      uses: actions/configure-pages@v4
    
    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: '_site'
    
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
